<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!-- ===== GRADE DE QUADRADOS ===== -->
  <g fill="#6B6B6B">
    <rect x="20"  y="38"  width="110" height="110" rx="12"/>
    <rect x="142" y="38"  width="110" height="110" rx="12"/>
    <rect x="20"  y="160" width="110" height="110" rx="12"/>
    <rect x="142" y="160" width="110" height="110" rx="12"/>
  </g>

  <!-- ===== ÍCONES (BRANCOS) ===== -->
  <g fill="#FFFFFF">
    <!-- 1. Carro + caminhão -->
    <path d="M32 116 C32 108 34 105 39 104 L46 94 H64 L71 104 C76 105 78 108 78 116 Z"/>
    <circle cx="42" cy="118" r="5.5"/>
    <circle cx="68" cy="118" r="5.5"/>
    <rect x="82" y="92" width="24" height="22" rx="2"/>
    <path d="M106 114 V100 h8 l6 10 v4 Z"/>
    <circle cx="92" cy="118" r="5"/>
    <circle cx="114" cy="118" r="5"/>

    <!-- 2. Casa + prédio -->
    <rect x="200" y="66" width="28" height="60" rx="2"/>
    <path d="M150 100 L172 78 L194 100 Z"/>
    <rect x="156" y="100" width="32" height="26"/>

    <!-- 3. Avião + navio -->
    <rect x="38" y="192" width="58" height="8" rx="4"/>
    <path d="M58 196 L74 178 L82 178 L72 196 Z"/>
    <path d="M58 196 L74 214 L82 214 L72 196 Z"/>
    <path d="M38 196 L28 187 L36 196 L28 205 Z"/>
    <rect x="60" y="234" width="16" height="10" rx="1"/>
    <path d="M38 244 L100 244 L92 256 Q68 262 46 256 Z"/>

    <!-- 4. Família -->
    <circle cx="166" cy="194" r="8"/>
    <rect x="154" y="206" width="24" height="30" rx="9"/>
    <circle cx="198" cy="194" r="8"/>
    <rect x="186" y="206" width="24" height="30" rx="9"/>
  </g>

  <!-- detalhes em cinza (janelas do prédio) -->
  <g fill="#6B6B6B">
    <rect x="206" y="74" width="5" height="5"/>
    <rect x="217" y="74" width="5" height="5"/>
    <rect x="206" y="86" width="5" height="5"/>
    <rect x="217" y="86" width="5" height="5"/>
    <rect x="206" y="98" width="5" height="5"/>
    <rect x="217" y="98" width="5" height="5"/>
  </g>

  <!-- criança em primeiro plano, com contorno cinza para separar -->
  <circle cx="182" cy="222" r="5" fill="#FFFFFF" stroke="#6B6B6B" stroke-width="3"/>
  <rect x="174" y="230" width="16" height="22" rx="6" fill="#FFFFFF" stroke="#6B6B6B" stroke-width="3"/>

  <!-- ===== TEXTO ===== -->
  <text x="286" y="152" font-family="Helvetica, Arial, sans-serif"
        font-size="92" font-weight="700" letter-spacing="2" fill="#6B6B6B">SNS</text>
  <text x="290" y="198" font-family="Helvetica, Arial, sans-serif"
        font-size="27" letter-spacing="1.5" fill="#0369A1">Corretora de Seguros</text>
</svg>